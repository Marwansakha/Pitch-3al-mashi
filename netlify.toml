# Send traffic on the production Netlify subdomain to the custom domain.
# The hostname is matched exactly, so deploy previews
# (deploy-preview-<id>--loquacious-cobbler-451547.netlify.app)
# and branch deploys (<branch>--loquacious-cobbler-451547.netlify.app)
# are left alone.
[[redirects]]
  from = "https://loquacious-cobbler-451547.netlify.app/*"
  to = "https://marwandoesai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://loquacious-cobbler-451547.netlify.app/*"
  to = "https://marwandoesai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://loquacious-cobbler-451547.netlify.app"
  to = "https://marwandoesai.com/"
  status = 301
  force = true

[[redirects]]
  from = "http://loquacious-cobbler-451547.netlify.app"
  to = "https://marwandoesai.com/"
  status = 301
  force = true

# The video grid lives at /bio. Exact /links and /links/ go to the homepage.
# force is required because /links/index.html exists and would otherwise win.
# These two rules are exact, so /links/<slug> is not redirected.
# They are listed before the splat rules, and they do not point at /bio,
# so /bio is never rewritten to /links and then sent home.
[[redirects]]
  from = "/links"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/links/"
  to = "/"
  status = 301
  force = true

# /bio renders the grid. A video slug (/bio/video-slug or the older
# /links/video-slug) rewrites to the same page. These rules are not forced,
# so real files such as /links/thumbs/* and /links/avatar.svg are still served.
# The rewrite target is the file /links/index.html, not the path /links.
[[redirects]]
  from = "/bio"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/bio/"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/bio/*"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/links/*"
  to = "/links/index.html"
  status = 200
