# Send traffic on the production Netlify subdomain to the custom domain.
# The hostname is matched exactly, so deploy previews
# (deploy-preview-<id>--loquacious-cobbler-451547.netlify.app)
# and branch deploys (<branch>--loquacious-cobbler-451547.netlify.app)
# are left alone.
[[redirects]]
  from = "https://loquacious-cobbler-451547.netlify.app/*"
  to = "https://marwandoesai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://loquacious-cobbler-451547.netlify.app/*"
  to = "https://marwandoesai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://loquacious-cobbler-451547.netlify.app"
  to = "https://marwandoesai.com/"
  status = 301
  force = true

[[redirects]]
  from = "http://loquacious-cobbler-451547.netlify.app"
  to = "https://marwandoesai.com/"
  status = 301
  force = true

# Link-in-bio. /bio is the short path for an Instagram or TikTok bio.
# A video slug (/links/video-slug or /bio/video-slug) rewrites to the page
# so the link is shareable. These rules are not forced, so real files
# such as /links/thumbs/* are still served.
[[redirects]]
  from = "/bio"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/bio/"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/bio/*"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/links/*"
  to = "/links/index.html"
  status = 200
