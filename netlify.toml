# Install the function dependency. The site itself is still the repo root.
[build]
  command = "node rates/build.mjs && npm ci --omit=dev"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Send traffic on the production Netlify subdomain to the custom domain.
# The hostname is matched exactly, so deploy previews
# (deploy-preview-<id>--loquacious-cobbler-451547.netlify.app)
# and branch deploys (<branch>--loquacious-cobbler-451547.netlify.app)
# are left alone.
[[redirects]]
  from = "https://loquacious-cobbler-451547.netlify.app/*"
  to = "https://marwandoesai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://loquacious-cobbler-451547.netlify.app/*"
  to = "https://marwandoesai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://loquacious-cobbler-451547.netlify.app"
  to = "https://marwandoesai.com/"
  status = 301
  force = true

[[redirects]]
  from = "http://loquacious-cobbler-451547.netlify.app"
  to = "https://marwandoesai.com/"
  status = 301
  force = true

# rates.marwandoesai.com is routed in netlify/edge-functions/rates-host.mjs.
# A Host condition never matches, so it is not used.

# The video grid lives at /bio. Exact /links and /links/ go to the homepage.
# force is required because /links/index.html exists and would otherwise win.
# These two rules are exact, so /links/<slug> is not redirected.
# They are listed before the splat rules, and they do not point at /bio,
# so /bio is never rewritten to /links and then sent home.
[[redirects]]
  from = "/links"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/links/"
  to = "/"
  status = 301
  force = true

# /bio renders the grid. A video slug (/bio/video-slug or the older
# /links/video-slug) rewrites to the same page. These rules are not forced,
# so real files such as /links/thumbs/* and /links/avatar.svg are still served.
# The rewrite target is the file /links/index.html, not the path /links.
[[redirects]]
  from = "/bio"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/bio/"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/bio/*"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/links/*"
  to = "/links/index.html"
  status = 200

# The workshop page is a real file. Force the bare path to that file so
# /grok-workshop returns 200, same as /grok-workshop/.
[[redirects]]
  from = "/grok-workshop"
  to = "/grok-workshop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grok-workshop/register"
  to = "/grok-workshop/register/index.html"
  status = 200
  force = true

# The MiroFish how-to is a real file. Force the bare path so
# /mirofish-howto returns 200, same as /mirofish-howto/.
[[redirects]]
  from = "/mirofish-howto"
  to = "/mirofish-howto/index.html"
  status = 200
  force = true

# The rate-card source is not part of the site. /rates and /rates/* stay
# noindex, including every private per-brand page.
[[redirects]]
  from = "/rates/rates.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/rates/build.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/rates/README.md"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/rates"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/rates/"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/rates/*"
  [headers.values]
    X-Robots-Tag = "noindex"
