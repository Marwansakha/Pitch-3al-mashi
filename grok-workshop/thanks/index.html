<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تمام، وصلنا تسجيلك | ورشة Grok Bot</title>
<meta name="description" content="وصلنا تسجيلك في ورشة Grok Bot. رح نتواصل معك بكل تفاصيل الورشة.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F3EE">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--ink:#1A1A1A;--ink2:#3A3835;--muted:#5C5852;--rule:#E0DCD4;
  --amber:#B8860B;--amber-ink:#7A5A08;--on-ink:#F5F3EE;
  color-scheme:light;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","DM Sans","Noto Kufi Arabic",Tahoma,sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber-ink);outline-offset:3px}
::selection{background:var(--amber);color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
header.top{border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;height:64px}
.brand{text-decoration:none;font-weight:700}
main{padding:72px 0}
h1{font-size:clamp(32px,5vw,48px);line-height:1.3;font-weight:700;margin:0 0 16px;text-wrap:balance}
p{margin:0 0 28px;color:var(--ink2);font-size:18px;max-width:28em}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--on-ink);text-decoration:none;font-weight:500;border-radius:999px;padding:14px 22px;min-height:48px}
.pay-summary{list-style:none;margin:0 0 20px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid;gap:8px;max-width:28em}
.pay-summary li{display:flex;justify-content:space-between;gap:12px}
.pay-summary span{color:var(--muted);font-size:14px}
.pay-methods{margin:12px 0 20px;color:var(--muted);font-size:14px}
.back{color:var(--muted);text-decoration:none}
.btn:hover{background:var(--amber);color:var(--ink)}
footer{border-top:1px solid var(--rule);padding:28px 0 calc(28px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:14px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--ink)}
@media (max-width:640px){
  .wrap{padding:0 20px}
  main{padding:48px 0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">مروان أبو سخا</a>
  </div>
</header>
<main>
  <div class="wrap">
    <h1 id="thanks-title">تم حجز مقعدك مبدئياً</h1>
    <p id="thanks-body">مقعدك محجوز لمدة يومين لحين إتمام الدفع</p>
    <ul class="pay-summary" id="thanks-summary">
      <li><span>الورشة</span><b>ورشة Grok Bot</b></li>
      <li><span>التاريخ</span><b>الجمعة 18 والسبت 19 ديسمبر</b></li>
      <li><span>الوقت</span><b>ساعتين كل يوم، 6:00–8:00 المسا</b></li>
      <li><span>السعر</span><b>780 درهم</b></li>
    </ul>
    <p id="thanks-pay"><a class="btn" id="pay-now" href="https://buy.stripe.com/9B66oH0ewePha0b8F6cEw0Y">ادفع الآن لتأكيد مقعدك</a></p>
    <p class="pay-methods" id="thanks-methods">تقدر تدفع بـ Apple Pay أو بالبطاقة</p>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var pay = document.getElementById("pay-now");
        if (params.get("list") === "waitlist") {
          document.getElementById("thanks-title").textContent = "تم تسجيلك على قائمة الانتظار";
          document.getElementById("thanks-body").textContent = "اسمك على القائمة. بنبعتلك إيميل أول ما ينفتح تاريخ الجلسة الجاية.";
          document.getElementById("thanks-pay").hidden = true;
          document.getElementById("thanks-summary").hidden = true;
          document.getElementById("thanks-methods").hidden = true;
          return;
        }
        var email = params.get("email");
        var payUrl = pay.getAttribute("href");
        if (email) payUrl = payUrl.split("?")[0] + "?prefilled_email=" + encodeURIComponent(email);
        pay.href = payUrl;
        setTimeout(function () { window.location.assign(payUrl); }, 3000);
      })();
    </script>
    <a class="back" href="/grok-workshop">العودة إلى الورشة</a>
  </div>
</main>
<footer>
  <div class="wrap">
    <a href="/">مروان أبو سخا</a>
  </div>
</footer>
</body>
</html>
